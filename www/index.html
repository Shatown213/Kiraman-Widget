<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kiraman</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Amiri:wght@700&family=Outfit:wght@400;500;600&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#06221a;--bg2:#0d3b2b;--bg3:#124a36;--gold:#D4AF37;--cream:#F3EAD3;--err:#ff6b6b;--gl:#ff4d8d;--ok:#4cd694;--mut:#8fae9f;--bd:rgba(212,175,55,.22);color-scheme:dark;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#06221a}}
:root[data-theme="dark"]{--bg:#06221a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:radial-gradient(120% 60% at 50% -10%,#0f5a3e 0,var(--bg) 60%) fixed;color:var(--cream);font-family:'Outfit',system-ui,sans-serif;font-size:16px;line-height:1.35}
#app{flex:1;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));max-width:560px;width:100%;margin:0 auto}
.arabic-title{font-family:'Amiri','Noto Naskh Arabic','Traditional Arabic',serif;font-weight:700;font-size:42px;line-height:1.05;text-align:center;margin:-6px 0 12px;background:linear-gradient(180deg,#f6e7b0,#D4AF37 70%,#a98a22);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:0;text-shadow:none;filter:drop-shadow(0 2px 8px rgba(212,175,55,.22))}
.emb-logo{display:block;margin:0 auto 2px;height:148px;width:auto;filter:drop-shadow(0 6px 18px rgba(212,175,55,.18))}
.it .e .ico{display:block;height:46px;width:auto;max-width:78%;margin:auto;object-fit:contain}
.it .e .ic-p{display:none}
.it.lk .e{filter:saturate(.75) brightness(.85)}.it.cr .e .ico{filter:drop-shadow(2px 0 var(--gl)) drop-shadow(-2px 0 var(--gold))}
h1{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:34px;letter-spacing:.16em;line-height:1.05;text-align:center;margin:0 0 3px;background:linear-gradient(180deg,#f6e7b0,#D4AF37 70%,#a98a22);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:15px;font-weight:600;color:var(--gold);margin:22px 2px 10px}
.px{font-size:13px!important;font-weight:600;color:var(--cream)}
.box{background:rgba(18,74,54,.55);border:1px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:12px}
.emb{display:block;margin:0 auto;width:150px;height:112px;filter:drop-shadow(0 6px 18px rgba(212,175,55,.25))}
.inv{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.it{position:relative;aspect-ratio:1;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.it .e{font-size:30px;line-height:1}
.it small{font-size:11px;margin-top:6px;color:var(--mut);text-align:center}
.it.ac{border-color:rgba(212,175,55,.6);box-shadow:inset 0 0 22px rgba(212,175,55,.22)}.it.ac small{color:var(--gold)}
.it.cr{border-color:var(--gl);animation:pu 1.2s ease-in-out infinite}.it.cr small{color:var(--gl)}
.it.cr .e{animation:gl .25s steps(2) infinite;text-shadow:2px 0 var(--gl),-2px 0 var(--gold)}
.it.cr::before{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(115deg,transparent 46%,var(--gl) 47% 48.5%,transparent 50%)}
.it.in{border-color:transparent}.it.in .e{filter:grayscale(1);opacity:.35}
.it.in::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,var(--bg) 40%,transparent 41%) 0 0/9px 9px;animation:dis 3s ease-in-out infinite alternate}
@keyframes gl{0%,100%{transform:translate(0)}25%{transform:translate(-3px,1px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,2px)}}
@keyframes pu{50%{box-shadow:0 0 18px rgba(255,77,141,.55)}}
@keyframes dis{from{opacity:.1}to{opacity:.9}}
.bar{height:10px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;margin:8px 0 12px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#b8962e,#f1d98a)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{font-family:inherit;font-size:14px;font-weight:500;line-height:1.3;color:var(--cream);background:rgba(255,255,255,.07);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.on{background:linear-gradient(180deg,#e6c85a,#c9a22e);color:#06221a;border-color:transparent;font-weight:600}
.btn.big{width:100%;margin-top:10px;padding:14px;font-size:15px}
.btn:focus-visible,nav button:focus-visible,.day:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.lv{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.lv .btn{flex:1 1 auto;text-align:center}
.alert{border-color:var(--gl);background:rgba(120,20,60,.35)}
.banner{border-color:var(--gold);background:rgba(212,175,55,.12)}
.mut{color:var(--mut);font-size:14px}
.chart{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:10px}
.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font-size:12px;color:var(--mut)}
.chart i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,#f1d98a,#b8962e);min-height:3px}
.day{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:rgba(18,74,54,.55);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:8px;color:var(--cream);font-family:inherit;font-size:16px;cursor:pointer}
.day.lk{opacity:.55}.day b{margin-left:auto;color:var(--gold);font-weight:600}
nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg);border-top:1px solid var(--bd);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px))}
nav button{font-family:inherit;font-size:12px;font-weight:500;color:var(--mut);background:none;border:0;border-radius:12px;padding:12px 2px;cursor:pointer}
nav button.on{color:var(--gold);background:rgba(212,175,55,.12)}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--gold);color:#06221a;font-weight:600;font-size:14px;padding:10px 14px;border-radius:14px;z-index:9;display:none;max-width:90%;text-align:center}
.sl{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}.sl .it{width:100%}
.nm{font-size:12px;color:var(--mut);line-height:1.2}
.lock{position:absolute;right:6px;bottom:4px;font-size:12px;font-style:normal}
h3{font-size:15px;font-weight:600;color:var(--gold);margin:0 0 12px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:16px;padding:12px 4px;text-align:center}
.tile b{display:block;font-size:22px;font-family:'Fraunces',Georgia,serif;color:var(--cream)}
.tile span{font-size:12px;color:var(--mut)}
.card{display:block;width:100%;text-align:left;color:inherit;font-family:inherit;font-size:inherit;cursor:pointer}
.chart.m{gap:2px}.chart.m div{font-size:0}
html[data-skin=retro]{--bg:#06251a;--cream:#F5E6BE;--mut:#9ab8a8;--bd:#2f8a5f;--gl:#FF4d8d}
html[data-skin=retro] body{background:linear-gradient(180deg,#0b3d2a 0,#06221a 100%) fixed;font-family:'Outfit',system-ui,sans-serif;font-size:16px;line-height:1.35}
html[data-skin=retro] h1{font-family:'Pixelify Sans','Outfit',monospace;font-weight:700;font-size:32px;letter-spacing:.12em;text-shadow:none;filter:drop-shadow(0 2px 0 #5a4410) drop-shadow(0 3px 0 #000)}
html[data-skin=retro] h2,html[data-skin=retro] h3,html[data-skin=retro] .px,html[data-skin=retro] .btn,html[data-skin=retro] nav button,html[data-skin=retro] .tile b{font-family:'Pixelify Sans','Outfit',monospace;font-weight:600}
html[data-skin=retro] h2,html[data-skin=retro] h3{font-size:15px;letter-spacing:.04em;line-height:1.4}
html[data-skin=retro] .px{font-size:13px!important}
html[data-skin=retro] .btn{font-size:13px;color:var(--cream);border:2px solid #0a2a1d;border-radius:6px;background:linear-gradient(180deg,#1d6b4b,#124a36);box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 3px 0 #04140d;padding:9px 8px}
html[data-skin=retro] .btn:active{transform:translateY(3px);box-shadow:inset 0 2px 0 rgba(255,255,255,.1)}
html[data-skin=retro] .btn.on{background:linear-gradient(180deg,#f0d676,#c9a22c);color:#06221a;border-color:#6e5514;box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 3px 0 #3d2e08}
html[data-skin=retro] .btn.big{font-size:14px}
html[data-skin=retro] .box,html[data-skin=retro] .day{background:linear-gradient(180deg,#14523a,#0d3b2b);border:2px solid var(--gold);border-radius:6px;box-shadow:inset 0 0 0 2px #0a2a1d,inset 0 4px 0 3px rgba(255,255,255,.06),0 4px 0 rgba(0,0,0,.5)}
html[data-skin=retro] .day{font-size:16px}
html[data-skin=retro] .tile{border:2px solid var(--bd);border-radius:4px;background:#0a2e20;box-shadow:inset 0 2px 0 rgba(255,255,255,.06)}
html[data-skin=retro] .tile b{font-size:16px}
html[data-skin=retro] .it{border:2px solid var(--gold);border-radius:6px;background:linear-gradient(180deg,#1a5c42,#0c3426);box-shadow:inset 0 0 0 2px #0a2a1d,0 3px 0 rgba(0,0,0,.5)}
html[data-skin=retro] .it.lk,html[data-skin=retro] .it.in{border-color:var(--bd)}.it.cr{border-color:var(--gl);animation:none}
html[data-skin=retro] .it .e .ic-s{display:none}
html[data-skin=retro] .it .e .ic-p{display:block;height:auto;width:auto;max-width:none;zoom:2;image-rendering:pixelated;margin:auto}
html[data-skin=retro] .bar{height:16px;border:2px solid var(--gold);border-radius:4px;background:#082418}
html[data-skin=retro] .bar i{border-radius:0;background:linear-gradient(180deg,#f6e7b0 0 30%,#D4AF37 30% 70%,#a98a22 70%)}
html[data-skin=retro] .chart i{border-radius:2px;background:linear-gradient(180deg,#f6e7b0,#D4AF37)}
html[data-skin=retro] .alert{background:#3a0d22;border-color:var(--gl)}.banner{background:var(--bg2)}
html[data-skin=retro] nav{background:var(--bg);border-top:2px solid var(--gold)}
html[data-skin=retro] nav button{font-size:12px;border-radius:6px}nav button.on{background:var(--bg2)}
html[data-skin=retro] #toast{border-radius:6px;border:2px solid #000;font-family:'Pixelify Sans','Outfit',sans-serif;font-size:13px}
html[data-skin=retro] .emb-px{image-rendering:pixelated;width:200px;height:auto;filter:drop-shadow(0 3px 0 #000)}
html[data-skin=retro] .mut{font-size:14px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:24px;z-index:20}
.pp{max-width:380px;width:100%;text-align:center;margin:0;animation:pi .25s ease-out}
@keyframes pi{from{transform:scale(.85);opacity:0}}
.fl{position:fixed;z-index:30;font-weight:700;font-size:24px;color:var(--gold);pointer-events:none;animation:fy .95s ease-out forwards;text-shadow:0 2px 6px #000;transform:translateX(-50%)}
.fl.dn{color:var(--gl)}
@keyframes fy{to{transform:translate(-50%,-80px);opacity:0}}
.it.nw{animation:nw 1.2s ease-out 3}
@keyframes nw{0%{box-shadow:0 0 0 0 rgba(212,175,55,.9)}100%{box-shadow:0 0 0 26px rgba(212,175,55,0)}}
.bar i{animation:gr .8s ease-out}
@keyframes gr{from{width:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.qibla-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 0}
.qibla-dial{width:min(72vw,260px);aspect-ratio:1;border-radius:50%;border:2px solid var(--gold);background:radial-gradient(circle,rgba(212,175,55,.09),rgba(6,34,26,.4) 68%);position:relative;display:grid;place-items:center;box-shadow:0 0 28px rgba(212,175,55,.12),inset 0 0 20px rgba(212,175,55,.08);transition:transform .18s linear;will-change:transform}
.qibla-dial:before{content:"";position:absolute;inset:9px;border:1px dashed var(--bd);border-radius:50%}
.q-label{position:absolute;font-weight:700;color:var(--gold);font-size:13px}.q-n{top:13px}.q-e{right:15px}.q-s{bottom:13px}.q-w{left:15px}
.q-needle{width:100%;height:100%;position:absolute;inset:0;transition:transform .2s ease;}
.q-needle:before{content:"";position:absolute;left:calc(50% - 2px);top:19%;height:31%;width:4px;background:linear-gradient(var(--gold),#fff0a9);clip-path:polygon(50% 0,100% 100%,50% 82%,0 100%);filter:drop-shadow(0 0 5px rgba(212,175,55,.6))}
.q-center{width:16px;height:16px;border-radius:50%;background:var(--gold);border:3px solid var(--bg);z-index:1;box-shadow:0 0 0 1px var(--gold)}
.q-kaaba{font-size:24px;position:absolute;top:7%;left:50%;filter:drop-shadow(0 0 8px rgba(212,175,55,.45));z-index:2;white-space:nowrap}

  const d=day(o),T=times(d),dn=d.getDay();
  if(T&&!ex){
   PR.forEach(([id,nm],i)=>{const t=T[PI[i]],lab=pname(id,nm,d);
    if(on('adhan'))add(t,'Heure '+(/^[AEIOUÉ]/.test(lab)?'d’':'de ')+lab,'Valide ta prière à l’heure pour protéger ton endurance.','prayers');
    if(on('pre'))add(new Date(t-15*M),lab+' dans 15 min',lab==='Jumu’a'?'Prépare-toi pour la prière du vendredi.':'Prépare tes ablutions.','prayers')});
  }
  if(T&&on('adhkar')){add(new Date(T[0].getTime()+20*M),'Adhkar du matin','Un moment de rappel après Fajr.');add(new Date(T[3].getTime()+15*M),'Adhkar du soir','Un moment de rappel après Asr.')}
  if(T&&on('tahaj')){const T2=times(day(o+1));if(T2){const a=T[4].getTime(),b=T2[0].getTime();add(new Date(a+(b-a)*2/3),'Dernier tiers de la nuit','Moment idéal pour le Tahajjud et l’invocation (dou’a).')}}
  if(on('jumua')&&dn===5){add(at(d,9,0),'Vendredi béni','Pense à la sourate Al-Kahf et aux invocations du vendredi.');if(S.g==='m'&&T&&!ex)add(new Date(T[2].getTime()-60*M),'Jumu’a dans 1 h','Ghusl, parfum et départ à la mosquée.','prayers')}
  if(!ex&&S.since){if(on('hier')){add(at(d,8,30),'Prières d’hier','Vérifie que tout est enregistré : tu as jusqu’à 14 h pour protéger ton endurance.');add(at(d,13,0),'Dernière heure','Complète le rapport d’hier avant 14 h.')}if(on('eve'))add(at(d,21,30),'Rapport du soir','Enregistre tes prières et tes quêtes du jour avant de dormir.')}
  if(on('quran'))add(at(d,20,0),'Lecture du Coran','Ta page du jour t’attend : chaque page compte dans tes quêtes.');
  if(on('weekly')&&dn===0)add(at(d,20,30),'Bilan de la semaine','Ton bilan hebdomadaire est prêt : découvre tes points et tes jours actifs.');
  if(on('water'))[11,15,19].forEach(h=>add(at(d,h,0),'Pense à boire','Un verre d’eau : c’est une quête du jour.'));
  if(on('move'))add(at(d,17,30),'Bouge un peu','Sport ou marche : quelques points à gagner aujourd’hui.');
 }
 if(on('crit'))IT.forEach((d,i)=>{const it=(S.items||{})[i];if(it&&it.st==='cr'&&it.since){const dl=it.since+864e5;add(new Date(dl-6*H),d[1]+' se fissure','Plus que 6 h : valide 3 prières à l’heure d’affilée ou fais un jeûne / Tahajjud.','prayers');add(new Date(dl-H),d[1]+' va se briser','Dernière heure ! Valide 3 prières à l’heure ou fais un jeûne / Tahajjud.','prayers');add(new Date(dl),d[1]+' est perdu','Remonte ton endurance au-dessus de '+d[3]+' % pendant 48 h pour le reforger.')}});
 return L.sort((a,b)=>a.t-b.t)}
function widget(){const w=WG();if(!w||!S.g)return;const ts=[];for(let o=0;o<3;o++){const d=day(o),T=times(d);if(T)PR.forEach(([id,nm],i)=>ts.push([pname(id,nm,d),T[PI[i]].getTime()]))}
 const nx=IT.find((d,i)=>((S.items||{})[i]||{st:'lk'}).st==='lk'),act=IT.filter((d,i)=>((S.items||{})[i]||{}).st==='ac').length;
 try{w.update({json:JSON.stringify({ts,e:ja(),xp:S.xp,nx:nx?nx[1]:'',nxp:nx?nx[2]:0,act,loc:S.pos?1:0})}).catch(()=>{})}catch(e){}}
async function grant(ask){const ln=LN();if(!ln)return false;let p=await ln.checkPermissions(),st=p.display;if(st!=='granted'&&ask!==false&&(st==='prompt'||st==='prompt-with-rationale'))st=(await ln.requestPermissions()).display;if(st!=='granted')return false;
 try{if(ln.checkExactNotificationSetting){const e=await ln.checkExactNotificationSetting();if(e&&e.exact_alarm!=='granted'&&!S.ntex){S.ntex=1;save();toast('Autorise les alarmes exactes pour recevoir les rappels à l’heure.');ln.changeExactNotificationSetting&&ln.changeExactNotificationSetting()}}}catch(e){}
 return true}
async function sync(force){widget();const ln=LN();if(!ln||!S.g)return;if(!(await grant()))return;
 try{await ln.createChannel({id:'prayers',name:'Prières',description:'Heure des prières et alertes importantes',importance:5,visibility:1,vibration:true,lights:true,lightColor:'#D4AF37'});await ln.createChannel({id:'reminders',name:'Rappels',description:'Rapport du jour, quêtes et bilans',importance:3,visibility:1,vibration:true})}catch(e){}
 const L=build(),sig=JSON.stringify(L.map(x=>[x.t,x.title]));if(!force&&sig===S.nsig)return;
 const pend=await ln.getPending();if(pend.notifications&&pend.notifications.length)await ln.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
 let id=1;if(L.length)await ln.schedule({notifications:L.map(x=>({id:id++,title:x.title,body:x.body,channelId:x.ch,schedule:{at:new Date(x.t),allowWhileIdle:true}}))});
 S.nsig=sig;save()}
let tmr=0;
const soon=()=>{clearTimeout(tmr);tmr=setTimeout(()=>sync().catch(()=>{}),1200)};
async function perm(){const ln=LN();if(!ln){toast('Les notifications fonctionnent dans l’application Android installée.');return}const ok=await grant(true);if(!ok){toast('Notifications refusées : autorise-les dans les réglages Android.');return}await sync(true);toast('Notifications activées.')}
async function test(){const ln=LN();if(ln){if(!(await grant(true))){toast('Notifications refusées dans Android.');return}try{await ln.createChannel({id:'reminders',name:'Rappels',importance:3,visibility:1,vibration:true})}catch(e){}await ln.schedule({notifications:[{id:2147000000,title:'Kiraman',body:'Les notifications fonctionnent.',channelId:'reminders',schedule:{at:new Date(Date.now()+3000),allowWhileIdle:true}}]});toast('Notification de test dans 3 secondes.')}else if(window.Notification){const r=await Notification.requestPermission();if(r==='granted'){new Notification('Kiraman',{body:'Les notifications fonctionnent.'});toast('Notification envoyée.')}else toast('Notifications refusées par le navigateur.')}else toast('Notifications indisponibles ici.')}
function box(){return'<h2>Notifications</h2><div class="box"><div class="mut" style="margin-bottom:10px">Les rappels sont programmés sur 7 jours et mis à jour à chaque ouverture de l’application.'+(LN()?'':' Ils seront actifs dans l’application Android installée.')+'</div>'+LAB.map(([k,t])=>`<div class="row" style="margin-bottom:8px"><span style="flex:1">${t}</span><button class="btn ${on(k)?'on':''}" data-a="nt|${k}">${on(k)?'Activé':'Désactivé'}</button></div>`).join('')+'<button class="btn big on" data-a="ntperm">Activer les notifications</button><button class="btn big" data-a="nttest">Envoyer une notification de test</button><div class="mut" style="margin-top:10px">Widget : appui long sur l’écran d’accueil Android, puis Widgets, puis Kiraman.</div></div>'}
return{on,soon,sync,perm,test,box,build}})();
if(S.ped)startPed();refMq();document.addEventListener('visibilitychange',()=>{if(!document.hidden){refMq();KN.soon()}});document.addEventListener('input',e=>{if(e.target.id==='vol'){S.vol=+e.target.value;save()}});render();KN.soon();
</script></body></html>
