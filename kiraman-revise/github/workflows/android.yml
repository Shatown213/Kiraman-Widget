name: Build APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances
        run: npm install

      - name: Créer le projet Android (si absent)
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Ajouter permissions, widget et code natif
        run: bash scripts/patch-android.sh

      - name: Générer les icônes (si assets/icon.png existe)
        run: |
          if [ -f assets/icon.png ]; then
            npx @capacitor/assets generate --android --iconBackgroundColor '#06221a' --iconBackgroundColorDark '#06221a' || echo "Icônes par défaut conservées"
          fi

      - name: Synchroniser le contenu web
        run: npx cap sync android

      - name: Compiler l'APK (debug, installable directement)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v6
        with:
          name: kiraman-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
